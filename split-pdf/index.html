<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split PDF — Private PDF Tools</title>
    <meta
      name="description"
      content="Split a PDF into smaller files, locally in your browser. No account. No upload. No watermark."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/ui/split-page.ts"></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb"><a href="/">&larr; All PDF tools</a></nav>
      <h1>Split PDF</h1>
      <p class="tool-description">
        Break one PDF into several smaller files, either every N pages or by page ranges. Files are
        processed locally in your browser and never uploaded.
      </p>

      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop a PDF here, or</p>
        <button type="button" id="pick-files">Choose a file</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" />
      </div>

      <ul id="file-list" class="file-list" aria-label="Selected file"></ul>

      <fieldset class="options">
        <legend>How to split</legend>
        <label>
          <input type="radio" name="mode" value="every" checked />
          Every
          <input type="number" id="every-n" value="1" min="1" step="1" inputmode="numeric" />
          page(s) per file
        </label>
        <label>
          <input type="radio" name="mode" value="ranges" />
          Page ranges
          <input type="text" id="ranges" placeholder="e.g. 1-3, 5, 8-10" />
        </label>
      </fieldset>

      <div class="actions">
        <button type="button" id="run" class="primary" disabled>Split PDF</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="downloads" class="downloads"></ul>
    </main>
    <footer class="site">
      <p>Your files stay on your device. Nothing is uploaded.</p>
    </footer>
  </body>
</html>
