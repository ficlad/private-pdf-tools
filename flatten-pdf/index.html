<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flatten PDF form — Private PDF Tools</title>
    <meta
      name="description"
      content="Flatten PDF form fields into static page content, locally in your browser. No account. No upload. No watermark."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/ui/flatten-page.ts"></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb"><a href="../">&larr; All PDF tools</a></nav>
      <h1>Flatten PDF form</h1>
      <p class="tool-description">
        Turn filled form fields into ordinary page content so they can no longer be edited. Files
        are processed locally in your browser and never uploaded.
      </p>

      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop a PDF here, or</p>
        <button type="button" id="pick-files">Choose a file</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" />
      </div>

      <ul id="file-list" class="file-list" aria-label="Selected file"></ul>

      <div class="actions">
        <button type="button" id="run" class="primary" disabled>Flatten form</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="downloads" class="downloads"></ul>
    </main>
    <footer class="site">
      <p>Your files stay on your device. Nothing is uploaded.</p>
    </footer>
  </body>
</html>
