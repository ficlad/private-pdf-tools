# Deploys the production build to GitHub Pages on every push to main.
# The build uses a relative base (vite.config.ts `base: './'`), so the same
# output works at https://<user>.github.io/<repo>/ and at a custom domain.
#
# Note: GitHub Pages cannot send custom response headers, so the strict CSP
# from public/_headers is NOT applied here — Pages hosting is for testing.
# Production hosting with full security headers is Cloudflare Pages (spec §5.1).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
