<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change page size — Private PDF Tools</title>
    <meta
      name="description"
      content="Change the page size of a PDF, locally in your browser. No account. No upload. No watermark."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/ui/resize-page.ts"></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb"><a href="../">&larr; All PDF tools</a></nav>
      <h1>Change page size</h1>
      <p class="tool-description">
        Scale pages to a new size, or change the canvas and keep content as it is. Files are
        processed locally in your browser and never uploaded.
      </p>

      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop a PDF here, or</p>
        <button type="button" id="pick-files">Choose a file</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" />
      </div>

      <ul id="file-list" class="file-list" aria-label="Selected file"></ul>

      <fieldset class="options">
        <legend>New size</legend>
        <label>
          Page size
          <select id="size-preset">
            <option value="a4" selected>A4</option>
            <option value="letter">Letter</option>
            <option value="custom">Custom (points)</option>
          </select>
        </label>
        <label
          >Width <input type="number" id="custom-width" value="595" min="3" max="14400"
        /></label>
        <label
          >Height <input type="number" id="custom-height" value="842" min="3" max="14400"
        /></label>
        <label
          ><input type="radio" name="resize-mode" value="scale" checked /> Scale content to fit,
          centered</label
        >
        <label
          ><input type="radio" name="resize-mode" value="canvas" /> Resize canvas only (content
          keeps its size)</label
        >
      </fieldset>
      <div class="actions">
        <button type="button" id="run" class="primary" disabled>Change page size</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="downloads" class="downloads"></ul>
    </main>
    <footer class="site">
      <p>Your files stay on your device. Nothing is uploaded.</p>
    </footer>
  </body>
</html>
