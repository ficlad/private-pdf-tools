<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add watermark — Private PDF Tools</title>
    <meta
      name="description"
      content="Stamp a text watermark across every page of a PDF, locally in your browser. No account. No upload. No watermark."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/ui/watermark-page.ts"></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb"><a href="/">&larr; All PDF tools</a></nav>
      <h1>Add watermark</h1>
      <p class="tool-description">
        Add a semi-transparent text watermark, like DRAFT or CONFIDENTIAL, across every page. Files
        are processed locally in your browser and never uploaded.
      </p>

      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop a PDF here, or</p>
        <button type="button" id="pick-files">Choose a file</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" />
      </div>

      <ul id="file-list" class="file-list" aria-label="Selected file"></ul>

      <fieldset class="options">
        <legend>Watermark</legend>
        <label
          >Text <input type="text" id="wm-text" placeholder="e.g. DRAFT" maxlength="100"
        /></label>
        <label>
          Opacity
          <input type="number" id="wm-opacity" value="0.25" min="0.05" max="1" step="0.05" />
        </label>
        <label>
          Rotation
          <input type="number" id="wm-rotation" value="45" min="-360" max="360" step="5" /> degrees
        </label>
      </fieldset>
      <div class="actions">
        <button type="button" id="run" class="primary" disabled>Add watermark</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="downloads" class="downloads"></ul>
    </main>
    <footer class="site">
      <p>Your files stay on your device. Nothing is uploaded.</p>
    </footer>
  </body>
</html>
