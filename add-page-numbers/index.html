<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add page numbers — Private PDF Tools</title>
    <meta
      name="description"
      content="Stamp page numbers onto a PDF, locally in your browser. No account. No upload. No watermark."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/ui/page-numbers-page.ts"></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb"><a href="../">&larr; All PDF tools</a></nav>
      <h1>Add page numbers</h1>
      <p class="tool-description">
        Choose a position and format, and every page gets its number. Files are processed locally in
        your browser and never uploaded.
      </p>

      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop a PDF here, or</p>
        <button type="button" id="pick-files">Choose a file</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" />
      </div>

      <ul id="file-list" class="file-list" aria-label="Selected file"></ul>

      <fieldset class="options">
        <legend>Numbering</legend>
        <label>
          Position
          <select id="position">
            <option value="bottom-center" selected>Bottom center</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
            <option value="top-center">Top center</option>
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
          </select>
        </label>
        <label>
          Format
          <select id="format">
            <option value="n" selected>1</option>
            <option value="page-n">Page 1</option>
            <option value="n-of-total">1 / 9</option>
            <option value="page-n-of-total">Page 1 of 9</option>
          </select>
        </label>
        <label>Start at <input type="number" id="start-at" value="1" min="0" step="1" /></label>
        <label>
          Margin
          <input type="number" id="margin" value="24" min="0" max="200" step="1" /> points
        </label>
      </fieldset>
      <div class="actions">
        <button type="button" id="run" class="primary" disabled>Add page numbers</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="downloads" class="downloads"></ul>
    </main>
    <footer class="site">
      <p>Your files stay on your device. Nothing is uploaded.</p>
    </footer>
  </body>
</html>
